[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
version = "v1.0.4"
name = "candigv2_logging"
dependencies = [
    "requests>=2.33.1",
    "PyJWT>=2.12.0"
    ]
requires-python = ">= 3.12"
description = "Common logging methods for CanDIGv2"
readme = "README.md"

[project.urls]
Repository = "https://github.com/CanDIG/candigv2-logging"
